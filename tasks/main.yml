---

    - name: Update repositories cache and install "python3-docker" package
      apt:
         name: python3-docker
         update_cache: yes

    - name: "create directory path to store the configuration files"
      file:
        path: "/opt/{{ docker_run_appname }}"
        state: directory
        mode: 0755
      
    - name: Touch the configuration file 
      file:
        path: /opt/{{ docker_run_appname }}/.env
        state: touch
        mode: u=rw,g=r,o=r
        
    - name: Set environment variables
      lineinfile:
        path: /opt/{{ docker_run_appname }}/.env
        line: "{{ item.key }}={{ item.value }}"
        create: yes
      with_dict: "{{ docker_run_env_variables }}"

    - name: Set docker_run_volume_on_container variable
      set_fact:
        docker_run_volume_on_container: "{{ docker_run_host_volume }}:{{ docker_run_volume }}:rw"
      when: docker_run_volume is defined and docker_run_volume != ''

    - name: "[Debian-like OS] Check available Ansible Python environments"
      ansible.builtin.stat:
        path: "{{ item }}/bin/pip"
      loop:
        - /var/tmp/.mamba/envs/ansible
        - /var/tmp/.ansible
      register: docker_run_ansible_environment_candidates
      when:
        - ansible_facts.distribution | lower == 'debian'
        - ansible_facts.distribution_major_version | int > 12
    
    - name: "[Debian-like OS] Select the Ansible Python environment"
      ansible.builtin.set_fact:
        docker_run_ansible_python_environment: >-
          {{
            (
              docker_run_ansible_environment_candidates.results
              | selectattr('stat.exists', 'equalto', true)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}
      when:
        - ansible_facts.distribution | lower == 'debian'
        - ansible_facts.distribution_major_version | int > 12
    
    - name: "[Debian-like OS] Fail when no supported Python environment exists"
      ansible.builtin.fail:
        msg: >-
          Cannot find pip in /var/tmp/.mamba/envs/ansible
          or /var/tmp/.ansible.
      when:
        - ansible_facts.distribution | lower == 'debian'
        - ansible_facts.distribution_major_version | int > 12
        - docker_run_ansible_python_environment | length == 0
    
    - name: "[Debian-like OS] Install requests into the Ansible environment on Debian 13"
      ansible.builtin.pip:
        name: requests
        executable: "{{ docker_run_ansible_python_environment }}/bin/pip"
      when:
        - ansible_facts.distribution | lower == 'debian'
        - ansible_facts.distribution_major_version | int > 12

    - name: Running the container
      docker_container:
        name: "{{ docker_run_appname }}"
        image: "{{ docker_run_image }}:{{ docker_run_tag }}"
        env_file: /opt/{{ docker_run_appname }}/.env
        command: "{{ docker_run_command }}"
        ports: "{{ docker_run_ports }}"
        volumes: "{{ docker_run_volume_on_container | default(omit) }}"
        detach: True
        state: started
